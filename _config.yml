# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: dalong's blog
subtitle: '保持思考，记录，分享'
description: 'dalong 的个人博客 - 保持思考，记录，分享'
keywords: 博客,技术,前端,Astro,Markdown
author: dalong
language: zh-cn
timezone: Asia/Shanghai

# URL
## GitHub Pages project site. Repo: lh1564803535-code/my-blog
url: https://lh1564803535-code.github.io/my-blog
root: /my-blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: false

# Syntax highlighting
highlight:
  enable: false
prismjs:
  enable: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: typography

plugin:
  - hexo-generator-category-enhance
  - hexo-generator-feed
  - hexo-asset-image
  - hexo-prism-plugin
  - hexo-toc
  - hexo-generator-searchdb

archive_generator:
  per_page: 0

category_generator:
  per_page: 10
  enable_index_page: true

tag_generator:
  per_page: 10
  enable_index_page: true

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '

prism_plugin:
  mode: preprocess
  theme: default
  line_number: false

toc:
  maxDepth: 3

# 本地搜索：hexo-generator-searchdb 生成 search.json 供前端搜索
search:
  path: search.json
  field: post
  content: true
  format: striptags

deploy:
  type: ''
